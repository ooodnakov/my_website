name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main-typecheck
            node-version: 22
            working-directory: apps/main
            lockfile: apps/main/pnpm-lock.yaml
            install-all: false
            command: pnpm run check
          - name: cv-lint
            node-version: 22
            working-directory: apps/cv-site
            lockfile: apps/cv-site/pnpm-lock.yaml
            install-all: false
            command: pnpm run lint
          - name: cv-test
            node-version: 22
            working-directory: apps/cv-site
            lockfile: apps/cv-site/pnpm-lock.yaml
            install-all: false
            command: pnpm run test
          - name: legacy-build
            node-version: 22
            working-directory: apps/legacy_rewored
            lockfile: apps/legacy_rewored/pnpm-lock.yaml
            install-all: false
            command: pnpm run build
          - name: unified-build
            node-version: 22
            working-directory: .
            lockfile: |
              apps/main/pnpm-lock.yaml
              apps/cv-site/pnpm-lock.yaml
              apps/legacy_rewored/pnpm-lock.yaml
            install-all: true
            command: pnpm --dir apps/main build
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install dependencies
        if: ${{ !matrix.install-all }}
        working-directory: ${{ matrix.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Install all app dependencies
        if: ${{ matrix.install-all }}
        run: |
          pnpm --dir apps/main install --frozen-lockfile
          pnpm --dir apps/cv-site install --frozen-lockfile
          pnpm --dir apps/legacy_rewored install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.command }}
