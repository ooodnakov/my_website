name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-checks:
    runs-on: ${{ matrix.name == 'main-browser' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main-typecheck
            node-version: 22
            working-directory: apps/main
            lockfile: apps/main/pnpm-lock.yaml
            install-all: false
            command: pnpm run check
          - name: main-terminal
            node-version: 22
            working-directory: apps/main
            lockfile: apps/main/pnpm-lock.yaml
            install-all: false
            command: pnpm run test:terminal
          - name: main-browser
            node-version: 22
            working-directory: .
            lockfile: |
              apps/main/pnpm-lock.yaml
              apps/cv-site/pnpm-lock.yaml
              apps/legacy_rewored/pnpm-lock.yaml
            install-all: true
            command: pnpm run test:e2e:production
          - name: cv-lint
            node-version: 22
            working-directory: apps/cv-site
            lockfile: apps/cv-site/pnpm-lock.yaml
            install-all: false
            command: pnpm run lint
          - name: cv-test
            node-version: 22
            working-directory: apps/cv-site
            lockfile: apps/cv-site/pnpm-lock.yaml
            install-all: false
            command: pnpm run test
          - name: legacy-build
            node-version: 22
            working-directory: apps/legacy_rewored
            lockfile: apps/legacy_rewored/pnpm-lock.yaml
            install-all: false
            command: pnpm run build
          - name: unified-build
            node-version: 22
            working-directory: .
            lockfile: |
              apps/main/pnpm-lock.yaml
              apps/cv-site/pnpm-lock.yaml
              apps/legacy_rewored/pnpm-lock.yaml
            install-all: true
            command: pnpm --dir apps/main build
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install dependencies
        if: ${{ !matrix.install-all }}
        working-directory: ${{ matrix.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Install all app dependencies
        if: ${{ matrix.install-all }}
        run: |
          pnpm --dir apps/main install --frozen-lockfile
          pnpm --dir apps/cv-site install --frozen-lockfile
          pnpm --dir apps/legacy_rewored install --frozen-lockfile

      - name: Test browser OS metadata parsers
        if: ${{ matrix.name == 'main-browser' }}
        run: python3 -m unittest discover -s tools/browser-os -p 'test_*.py' -v

      - name: Generate pinned browser OS production assets
        if: ${{ matrix.name == 'main-browser' }}
        run: ./tools/browser-os/build.sh

      # build.sh names its output from a fixed version while the manifest records
      # the release derived from the built rootfs. Serve and upload the tree under
      # the manifest's own release so the app's pinned URL is what CI verified.
      - name: Align generated guest directory with its manifest release
        if: ${{ matrix.name == 'main-browser' }}
        run: |
          root=apps/main/client/public/browser-os
          dir=$(find "$root" -mindepth 1 -maxdepth 1 -type d -print -quit)
          release=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["release"])' "$dir/manifest.json")
          if [ "$(basename "$dir")" != "$release" ]; then
            mv "$dir" "$root/$release"
          fi
          test -f "$root/$release/manifest.json"

      # A green generation is not a usable tree until it is retrievable: this
      # uploads the complete generated guest so paired app verification can
      # consume exactly the bytes CI built and verified.
      - name: Upload generated browser OS guest
        if: ${{ matrix.name == 'main-browser' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-os-guest-${{ github.sha }}
          path: apps/main/client/public/browser-os
          if-no-files-found: error
          retention-days: 7

      - name: Install browser OS smoke dependencies
        if: ${{ matrix.name == 'main-browser' }}
        run: pnpm --dir tools/browser-os install --frozen-lockfile

      - name: Boot generated browser OS guest
        if: ${{ matrix.name == 'main-browser' }}
        run: |
          dir=$(find apps/main/client/public/browser-os -mindepth 1 -maxdepth 1 -type d -print -quit)
          pnpm --dir tools/browser-os smoke -- --node "$dir"

      - name: Build production application
        if: ${{ matrix.name == 'main-browser' }}
        run: pnpm --dir apps/main build

      - name: Install Chromium and Linux browser dependencies
        if: ${{ matrix.name == 'main-browser' }}
        working-directory: apps/main
        run: pnpm exec playwright install --with-deps chromium
      - name: Run development browser end-to-end suite
        if: ${{ matrix.name == 'main-browser' }}
        run: pnpm --dir apps/main test:e2e

      - name: Run ${{ matrix.name }}
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.command }}
